name: Plugin readme preview
description: Comment on a public plugin pull request with its readme preview and preflight results.
inputs:
  token:
    description: GitHub token with pull-requests write permission on the base repository.
    required: false
    default: ${{ github.token }}
  plugin-path:
    description: Relative directory containing the plugin readme and main PHP file.
    required: false
    default: ""
outputs:
  preview-url:
    description: Preview link pinned to the pull request head commit.
  warnings:
    description: Number of preflight warnings.
  comment-url:
    description: URL of the created or updated pull request comment.
runs:
  using: node24
  main: action/index.mjs
branding:
  icon: file-text
  color: blue
